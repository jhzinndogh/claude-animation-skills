<script type="module">
import * as THREE from "three";

// Low-poly (PS1/N64) biography: Silvio Santos, 1930-2024. 15 shots on separate sets, one visible at a time.
const SPEC = __SPEC__;
const RW = 360, RH = 640;
let seed = 1930;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(52, RW / RH, 0.08, 400);

// ------------------------------------------------------------ PS1 look
const SNX = (RW / 2).toFixed(1), SNY = (RH / 2).toFixed(1);
function ps1(m) {

    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      if (gl_Position.w > 0.0) { vec2 sn = vec2(${SNX}, ${SNY});

function tex(w, h, draw) {

// ------------------------------------------------------------ pixel font
const GL = {

  'O': ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'], 'P': ['####.', '#...#', '#...#', '####.', '#....', '#....', '#....'],
  'Q': ['.###.', '#...#', '#...#', '#...#', '#.#.#', '#..#.', '.##.#'], 'R': ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],
  'S': ['.###.', '#...#', '#....', '.###.', '....#', '#...#', '.###.'], 'T': ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  'U': ['#...#', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'], 'V': ['#...#', '#...#', '#...#', '#...#', '#...#', '.#.#.', '..#..'],

const textW = (s, sc) => s.length * 6 * sc - sc;
function bitText(g, str, x, y, s, c) { for (const ch of str) { const gl = GL[ch]; if (gl) gl.forEach((row, j) => { for (let i = 0; i < 5; i++) if (row[i] === '#') px(g, x + i * s, y + j * s, c, s, s); }); x += 6 * s; } }
// a sign: lines = [[text, scale], ...] centred
function signTex(w, h, lines, bg, fg, border) {
  return tex(w, h, (g) => {
    noise(g, 0, 0, w, h, bg, .03);
    if (border !== undefined) { px(g, 0, 0, col(border), w, 2); px(g, 0, h - 2, col(border), w, 2); px(g, 0, 0, col(border), 2, h); px(g, w - 2, 0, col(border), 2, h); }

    let y = Math.round((h - tot) / 2);
    for (const [s, sc] of lines) { bitText(g, s, Math.round((w - textW(s, sc)) / 2), y, sc, col(fg)); y += 7 * sc + 3; }

// ------------------------------------------------------------ helpers
const box = (parent, w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); return m;
};
const plane = (parent, w, h, mat, x, y, z, rx = 0, ry = 0, sx = 1, sy = 1, segX = 1, segY = 1) => {

};
const cyl = (parent, rt, rb, h, seg, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {

// ------------------------------------------------------------ shared textures
const T = {};
T.plaster = tex(32, 32, (g) => { noise(g, 0, 0, 32, 32, 0xffffff, .05); for (let k = 0; k < 25; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xd8d2c4)); });
T.wood = tex(32, 32, (g) => {
  for (let y = 0; y < 32; y++) { const b = [0x8a5a34, 0x7a4e2c, 0x956238, 0x815330][(y / 8) | 0]; for (let x = 0; x < 32; x++) px(g, x, y, col(b, .9 + rnd() * .14 + .05 * Math.sin(x * .6 + y))); }
  for (let y = 7; y < 32; y += 8) for (let x = 0; x < 32; x++) px(g, x, y, col(0x4a2e18));
});
T.cobble = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0x55504a, .05);
  for (let y = 0; y < 32; y += 4) for (let x = (y / 4 % 2) * 2; x < 32; x += 4) { px(g, x, y, col(0x7d766c, .9 + rnd() * .2), 3, 3); px(g, x, y, col(0x948c80), 2, 1); }
});
T.waves = tex(32, 32, (g) => {             // Rio's black-and-white wave pavement
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    const b = Math.floor((y + 4 * Math.sin(x / 32 * Math.PI * 2)) / 8) & 1;

});
function facade(base, shutter) {

      px(g, x - 1, y - 1, col(0xf3eee2), 8, 9); px(g, x, y, col(shutter), 6, 8); px(g, x + 3, y, col(shutter, .7), 1, 8);

T.facades = [facade(0xe8c98f, 0x2f5a3a), facade(0xd98e7a, 0x2c4a5e), facade(0xa8c6c0, 0x5b3a2a), facade(0xf0e2c6, 0x3c5a2e), facade(0xe6b0b8, 0x37506a)];
T.office = tex(32, 64, (g) => {
  noise(g, 0, 0, 32, 64, 0x8fa4b4, .04);
  for (let y = 2; y < 64; y += 6) for (let x = 2; x < 32; x += 6) px(g, x, y, col(rnd() < .3 ? 0xcfe6f2 : 0x3c5468), 4, 4);
});

});
T.night = tex(32, 64, (g) => { noise(g, 0, 0, 32, 64, 0x1c2030, .05); });
T.sunset = skyTex([0x2a2350, 0x4a3168, 0x7d3f6e, 0xc05a62, 0xee8a5a, 0xffc070, 0xffe0a0]);

// ------------------------------------------------------------ people
function faceTex(skin, hair, mouth) {

function person(o = {}) {

    box(torso, 0.08, 0.13, 0.07, mk, 0, 0.36, 0.17); box(torso, 0.06, 0.03, 0.05, lam({ color: 0x9a9a9a }), 0, 0.44, 0.17);

  box(head, 0.39, 0.09, 0.4, mHair, 0, 0.44, -0.02);

function stageShow(t, sign, old, wave = false, base = 0) {
  stageSign.material = sign; tvcam.visible = old;

  if (wave) {

    host.face('smile'); host.head.rotation.set(0, 0.1 * Math.sin(t * 1.3), 0.05 * Math.sin(t * 2));
    flyPlanes(stagePlanes, t, 78.5, 0.6, 2.2, [0.3, 1.9, 0.6]);
  } else {
    host.arms[1].sh.rotation.set(-2.4 + 1.3 * smooth(0, 0.35, fr), 0, 0.2); host.arms[1].el.rotation.x = -0.5 * (1 - fr);
    host.arms[0].sh.rotation.set(-0.3, 0, -0.5); host.arms[0].el.rotation.x = -1.2;
    host.face(Math.sin(t * 7) > 0.3 ? 'open' : 'smile'); host.head.rotation.y = 0.3 * Math.sin(t * 0.8);
    host.torso.rotation.y = 0.15 * Math.sin(t * 0.8);
    flyPlanes(stagePlanes, t, base, per, 1.9, [0.3, 1.9, 0.6]);
  }
  // audience cheers as the planes come
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), s1 = new THREE.Vector3(1, 1, 1);
  AUD.forEach((a, i) => {
    const c = 0.5 + 0.5 * Math.sin(t * (5 + a.r * 3) + a.r * 20);
    for (const sd of [-1, 1]) {
      e.set(0, 0, sd * lerp(2.9, 0.35 + 0.25 * a.r, c)); q.setFromEuler(e); v.set(a.x + sd * 0.25, a.y + 0.18, a.z);
      m4.compose(v, q, s1); audArms.setMatrixAt(i * 2 + (sd > 0 ? 1 : 0), m4);
    }
  });
  audArms.instanceMatrix.needsUpdate = true;
}

// ------------------------------------------------------------ captions: chunks spread over each section by length
const CAPS = [];
for (const sec of SPEC.sections) {
  const w = sec.chunks.map((c) => c.length + 8), tot = w.reduce((a, b) => a + b, 0);
  let t = sec.t0;
  sec.chunks.forEach((c, i) => { const d = (sec.t1 - sec.t0) * w[i] / tot; CAPS.push({ t0: t, t1: t + d, text: c }); t += d; });
}
const capEl = document.getElementById('cap'), vig = document.getElementById('vig'), flash = document.getElementById('flash'), cv = document.getElementById('c');
let lastCap = null;

function renderAt(t) {
  const shot = SHOTS.find((s) => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
  for (const k in SETS) SETS[k].visible = k === shot.set;
  const E = ENV[shot.env];
  scene.background.setHex(E.bg); scene.fog.color.setHex(E.bg); scene.fog.near = E.fog[0]; scene.fog.far = E.fog[1];
  hemi.color.setHex(E.sky); hemi.groundColor.setHex(E.gnd); hemi.intensity = E.hi;
  key.color.setHex(E.key); key.intensity = E.ki;
  const o = SETS[shot.set].position; key.position.set(o.x + E.kp[0], E.kp[1], E.kp[2]); key.target.position.copy(o);
  shot.run(t, t - shot.t0);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  cv.style.filter = shot.filter || 'none';
  vig.style.opacity = shot.vig ?? 0.25;
  flash.style.opacity = shot.flash ? (1 - smooth(0, 0.2, t - shot.t0)) * 0.85 : 0;
  const c = CAPS.find((c) => t >= c.t0 && t < c.t1);
  const txt = c ? c.text : '';
  if (txt !== lastCap) { capEl.textContent = txt; lastCap = txt; }
}
window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);
